<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>채팅</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#e9e9e9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.app{
  width:100%;
  max-width:430px;
  aspect-ratio:9/16;
  background:#f5f5f5;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #ccc;
}

.top{
  height:55px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
}

.name{
  font-size:12px;
  opacity:.6;
  margin-bottom:4px;
}

.replyBox{
  background:#f1f1f1;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:6px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.smallBtn{
  border:none;
  background:none;
  color:#666;
  font-size:12px;
}

.bottom{
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
  flex-shrink:0;
}

.replyPreview{
  background:#eee;
  padding:6px;
  border-radius:6px;
  font-size:12px;
  margin-bottom:6px;
  display:none;
}

.inputRow{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  height:42px;
  border:1px solid #ccc;
  border-radius:8px;
  padding:0 10px;
}

button{
  width:70px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
}
</style>
</head>
<body>

<div class="app">

<div class="top">
실시간 채팅
</div>

<div class="chat" id="chat"></div>

<div class="bottom">

<div class="replyPreview" id="replyPreview"></div>

<div class="inputRow">
<input id="input" placeholder="메시지 입력">
<button onclick="send()">전송</button>
</div>

</div>

</div>

<script>
const SUPABASE_URL =
"https://sqaxxayqngbngqefdvqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n6-WDrUrB4kMuHO_vImMwQ_yQxiPMjV";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const replyPreview =
document.getElementById("replyPreview");

let username =
localStorage.getItem("chat_name");

if(!username){

  username = prompt("이름 입력");

  if(!username || !username.trim()){
    username = "익명";
  }

  localStorage.setItem(
    "chat_name",
    username
  );
}

let replyText = "";

// 메시지 추가
function addMessage(msg){

  const div = document.createElement("div");

  div.className = "msg";

  let replyHtml = "";

  if(msg.reply){
    replyHtml =
    `<div class="replyBox">
      ${escapeHtml(msg.reply)}
    </div>`;
  }

  div.innerHTML = `
    <div class="name">
      ${escapeHtml(msg.name)}
    </div>

    ${replyHtml}

    <div>
      ${escapeHtml(msg.text)}
    </div>

    <div class="actions">

      <button class="smallBtn">
        답글
      </button>

      <button class="smallBtn">
        삭제
      </button>

    </div>
  `;

  // 답글
  div
  .querySelectorAll(".smallBtn")[0]
  .onclick = ()=>{

    replyText =
    `${msg.name}: ${msg.text}`;

    replyPreview.style.display =
    "block";

    replyPreview.textContent =
    "답글중: " + replyText;
  };

  // 삭제
  div
  .querySelectorAll(".smallBtn")[1]
  .onclick = async ()=>{

    if(confirm("삭제할까요?")){

      await db
      .from("messages")
      .delete()
      .eq("id",msg.id);

      loadMessages();
    }
  };

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

// 불러오기
async function loadMessages(){

  const { data } = await db
  .from("messages")
  .select("*")
  .order("id",{ascending:true});

  chat.innerHTML = "";

  data.forEach(msg=>{
    addMessage(msg);
  });

  chat.scrollTop = chat.scrollHeight;
}

// 보내기
async function send(){

  const text = input.value.trim();

  if(!text) return;

  await db
  .from("messages")
  .insert({
    name:username,
    text:text,
    reply:replyText
  });

  input.value = "";

  replyText = "";

  replyPreview.style.display =
  "none";
}

// 엔터 전송
input.addEventListener("keydown",e=>{

  if(e.key==="Enter"){
    send();
  }
});

// 실시간
db.channel("room")
.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"messages"
  },
  payload=>{

    addMessage(payload.new);
  }
)
.subscribe();

// 문자 보호
function escapeHtml(text){

  if(!text) return "";

  return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");
}

// 시작
loadMessages();
</script>

</body>
</html>
