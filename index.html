<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>채팅</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#e9e9e9;
}

.app{
  width:100vw;
  height:100vh;
  max-width:calc(100vh * 9 / 16);
  margin:auto;
  background:#f5f5f5;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.top{
  height:55px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.name{
  font-size:12px;
  opacity:.6;
  margin-bottom:6px;
}

.reply{
  background:#f1f1f1;
  border-left:3px solid #999;
  padding:6px;
  border-radius:6px;
  margin-bottom:8px;
  font-size:13px;
}

.msgText{
  word-break:break-word;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.actions button{
  height:28px;
  padding:0 10px;
  font-size:12px;
  background:#eee;
  color:black;
}

.bottom{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
  flex-shrink:0;
}

input{
  flex:1;
  height:44px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 12px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  cursor:pointer;
}

.sendBtn{
  width:70px;
}
</style>
</head>
<body>

<div class="app">

<div class="top" id="top">
실시간 채팅
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
<input id="input" placeholder="메시지 입력">
<button class="sendBtn" onclick="send()">전송</button>
</div>

</div>

<script>
const SUPABASE_URL =
"https://sqaxxayqngbngqefdvqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n6-WDrUrB4kMuHO_vImMwQ_yQxiPMjV";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const topBar = document.getElementById("top");

let username = localStorage.getItem("chat_name");

if(!username){

  username = prompt("이름 입력");

  if(!username || username.trim()==""){
    username = "익명";
  }

  localStorage.setItem("chat_name",username);
}

let adminMode = false;
let tapCount = 0;

let replyTarget = null;

// 관리자 모드
topBar.onclick = ()=>{

  tapCount++;

  setTimeout(()=>{
    tapCount = 0;
  },1000);

  if(tapCount >= 3){

    const code = prompt("코드");

    if(code === "js"){

      adminMode = true;

      alert("관리자 모드 활성화");
    }

    tapCount = 0;
  }
};

// 메시지 추가
function addMessage(data){

  const div = document.createElement("div");

  div.className = "msg";

  let replyHTML = "";

  if(data.reply){

    replyHTML = `
      <div class="reply">
        ${escapeHtml(data.reply)}
      </div>
    `;
  }

  div.innerHTML = `
    <div class="name">
      ${escapeHtml(data.name)}
    </div>

    ${replyHTML}

    <div class="msgText">
      ${escapeHtml(data.text)}
    </div>

    <div class="actions">
      <button class="replyBtn">
        답글
      </button>
    </div>
  `;

  // 답글
  div.querySelector(".replyBtn").onclick = ()=>{

    replyTarget = data.text;

    input.placeholder =
    "답글 작성중...";
  };

  // 관리자 삭제
  if(adminMode){

    const delBtn =
    document.createElement("button");

    delBtn.textContent = "삭제";

    delBtn.onclick = async ()=>{

      if(confirm("삭제?")){

        await db
        .from("messages")
        .delete()
        .eq("id",data.id);

        div.remove();
      }
    };

    div
    .querySelector(".actions")
    .appendChild(delBtn);
  }

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

// 불러오기
async function loadMessages(){

  const { data } = await db
  .from("messages")
  .select("*")
  .order("id",{ascending:true});

  chat.innerHTML = "";

  data.forEach(m=>{
    addMessage(m);
  });
}

// 보내기
async function send(){

  const text = input.value.trim();

  if(!text) return;

  await db
  .from("messages")
  .insert({
    name:username,
    text:text,
    reply:replyTarget
  });

  input.value = "";

  input.placeholder = "메시지 입력";

  replyTarget = null;
}

// 엔터
input.addEventListener("keydown",e=>{

  if(e.key==="Enter"){
    send();
  }
});

// 실시간
db.channel("room")
.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"messages"
  },
  payload=>{
    addMessage(payload.new);
  }
)
.subscribe();

// escape
function escapeHtml(text){

  if(!text) return "";

  return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");
}

// 시작
loadMessages();
</script>

</body>
</html>
