<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>채팅</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#f2f2f2;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.top{
  height:55px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid #ddd;
}

.name{
  font-size:12px;
  opacity:.6;
  margin-bottom:4px;
}

.bottom{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  height:42px;
  border:1px solid #ccc;
  border-radius:8px;
  padding:0 10px;
}

button{
  width:70px;
  border:none;
  border-radius:8px;
  background:black;
  color:white;
}
</style>
</head>
<body>

<div class="top" id="top">
  실시간 채팅
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
  <input id="input" placeholder="메시지 입력">
  <button onclick="send()">전송</button>
</div>

<script>
const SUPABASE_URL =
"https://sqaxxayqngbngqefdvqi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_n6-WDrUrB4kMuHO_vImMwQ_yQxiPMjV";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const topBar = document.getElementById("top");

// 이름 설정
let username = localStorage.getItem("chat_name");

if(!username){
  username = prompt("이름 입력");
  
  if(!username || username.trim()==""){
    username = "익명";
  }

  localStorage.setItem("chat_name",username);
}

// 관리자 모드
let tapCount = 0;

topBar.onclick = ()=>{

  tapCount++;

  setTimeout(()=>{
    tapCount = 0;
  },1000);

  if(tapCount >= 3){

    const code = prompt("코드 입력");

    if(code === "js"){

      const cmd = prompt(
`관리자 기능

1 = 채팅 전체 삭제`
      );

      // 전체 삭제
      if(cmd === "1"){

        if(confirm("전체 삭제?")){

          db
          .from("messages")
          .delete()
          .neq("id",0);

          chat.innerHTML = "";
        }
      }
    }

    tapCount = 0;
  }
};

// 메시지 추가
function addMessage(name,text){

  const div = document.createElement("div");

  div.className = "msg";

  div.innerHTML = `
    <div class="name">${escapeHtml(name)}</div>
    <div>${escapeHtml(text)}</div>
  `;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

// 기존 메시지 불러오기
async function loadMessages(){

  const { data } = await db
  .from("messages")
  .select("*")
  .order("id",{ascending:true});

  chat.innerHTML = "";

  data.forEach(m=>{
    addMessage(m.name,m.text);
  });

  chat.scrollTop = chat.scrollHeight;
}

// 전송
async function send(){

  const text = input.value.trim();

  if(!text) return;

  await db
  .from("messages")
  .insert({
    name:username,
    text:text
  });

  input.value = "";
}

// 엔터 전송
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    send();
  }
});

// 실시간
db.channel("room")
.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"messages"
  },
  payload=>{
    addMessage(
      payload.new.name,
      payload.new.text
    );
  }
)
.subscribe();

// HTML 문자 방지
function escapeHtml(text){

  return text
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");
}

// 시작
loadMessages();
</script>

</body>
</html>
